[build]
  command = "npx puppeteer browsers install chrome && npm run build"
  publish = "dist"

# Vite already bundles/minifies assets. Keep the CSP-hashed JSON-LD unchanged.
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = false
  minify = false
[build.processing.js]
  bundle = false
  minify = false
[build.processing.html]
  pretty_urls = true

[functions]
  directory = "netlify/functions"

# Redirect rules for SPA - serve prerendered files when they exist
[[redirects]]
  from = "/portfolio"
  to = "/portfolio/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/services/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200

# Fallback for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Response headers are maintained in public/_headers (one source of truth).
[build.environment]
  NODE_VERSION = "24"

[secrets.scan]
  # These two values are intentionally public browser configuration.
  omit_keys = ["VITE_SUPABASE_URL", "VITE_SUPABASE_ANON_KEY"]
